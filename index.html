<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiling Love...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1e1e1e; /* VS Code background */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4d4d4;
        }

        .terminal {
            width: 85%;
            max-width: 700px;
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #333333;
        }

        .terminal-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        .terminal-title {
            color: #999999;
            font-size: 13px;
            margin-left: 10px;
        }

        .terminal-body {
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 240px;
        }

        /* VS Code Dark+ Theme Colors */
        .comment { color: #6a9955; }
        .keyword { color: #569cd6; }
        .variable { color: #9cdcfe; }
        .function { color: #dcdcaa; }
        .string { color: #ce9178; }
        .punct { color: #d4d4d4; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #aeafad;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #777;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <div class="terminal-title">spin_wheel_date.html</div>
        </div>
        <div class="terminal-body" id="terminal-body"><span id="code-content"></span><span class="cursor"></span></div>
    </div>

    <div class="hint">Click anywhere on the page to enable typing sound effects!</div>

    <script>
        // Tokenized code structure exactly matching the first prompt's format, displaying the second prompt's code content
        const tokens = [
            { text: "// Initializing spin wheel date app...\n", type: "comment" },
            { text: "const", type: "keyword" },
            { text: " wheelConfig", type: "variable" },
            { text: " = {\n", type: "punct" },
            { text: "    title", type: "variable" },
            { text: ": ", type: "punct" },
            { text: '"Spin for a Date Night 🎡"', type: "string" },
            { text: ",\n    canvasSize", type: "variable" },
            { text: ": ", type: "punct" },
            { text: "300", type: "variable" },
            { text: ",\n    status", type: "variable" },
            { text: ": ", type: "punct" },
            { text: '"Ready to pick tonight\'s adventure"\n', type: "string" },
            { text: "};\n\n", type: "punct" },
            { text: "function", type: "keyword" },
            { text: " spinTheWheel", type: "function" },
            { text: "() {\n", type: "punct" },
            { text: "    const", type: "keyword" },
            { text: " options", type: "variable" },
            { text: " = [\n", type: "punct" },
            { text: '        "Movie night at home 🍿",\n        "Cook a new recipe together 🍝",\n        "Stargazing 🌌",\n        "Picnic in the park 🧺",\n        "Karaoke night 🎤",\n        "Try a new restaurant 🍜",\n        "Game night 🎲",\n        "Sunset walk 🌅",\n        "Photo booth strips 📸",\n        "Coffee date ☕"\n', type: "string" },
            { text: "    ];\n", type: "punct" },
            { text: "    const", type: "keyword" },
            { text: " winningIndex", type: "variable" },
            { text: " = ", type: "punct" },
            { text: "Math", type: "variable" },
            { text: ".", type: "punct" },
            { text: "floor", type: "function" },
            { text: "(", type: "punct" },
            { text: "Math", type: "variable" },
            { text: ".", type: "punct" },
            { text: "random", type: "function" },
            { text: "() * options.", type: "punct" },
            { text: "length", type: "variable" },
            { text: ");\n", type: "punct" },
            { text: "    ", type: "punct" },
            { text: "return", type: "keyword" },
            { text: ' options[winningIndex];\n', type: "string" },
            { text: "};\n\n", type: "punct" },
            { text: "// Executing choice sequence...\n", type: "comment" },
            { text: "console", type: "variable" },
            { text: ".", type: "punct" },
            { text: "log", type: "function" },
            { text: "(", type: "punct" },
            { text: "spinTheWheel", type: "function" },
            { text: "());", type: "punct" }
        ];

        let audioCtx = null;

        // Initialize Web Audio API on click
        window.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }, { once: true });

        // Play synthetic mechanical keyboard click sound
        function playKeySound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500 + Math.random() * 400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.02);
            } catch (e) {}
        }

        const container = document.getElementById("code-content");
        let tokenIdx = 0;
        let charIdx = 0;
        let currentSpan = null;

        function typeWriter() {
            if (tokenIdx < tokens.length) {
                const token = tokens[tokenIdx];
                
                if (charIdx === 0) {
                    currentSpan = document.createElement("span");
                    currentSpan.className = token.type;
                    container.appendChild(currentSpan);
                }

                const currentChar = token.text.charAt(charIdx);
                currentSpan.textContent += currentChar;
                
                // Play sound if character is not a newline/space
                if (currentChar.trim() !== "") {
                    playKeySound();
                }

                charIdx++;

                let typingSpeed = 35 + Math.random() * 25; // Random typing variation

                // Longer pause after a full line (when hitting newline)
                if (currentChar === '\n') {
                    typingSpeed = 450; 
                }

                if (charIdx >= token.text.length) {
                    tokenIdx++;
                    charIdx = 0;
                }

                setTimeout(typeWriter, typingSpeed);
            }
        }

        // Start typing after a short initial pause
        setTimeout(typeWriter, 1000);
    </script>

</body>
</html>
