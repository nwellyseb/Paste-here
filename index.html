    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1e1e1e; /* VS Code background */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4d4d4;
        }

        .terminal {
            width: 90%;
            max-width: 850px;
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #333333;
        }

        .terminal-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        .terminal-title {
            color: #999999;
            font-size: 13px;
            margin-left: 10px;
        }

        .terminal-body {
            padding: 20px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            height: 450px;
            overflow-y: auto;
        }

        /* VS Code Dark+ Theme Colors */
        .comment { color: #6a9955; }
        .keyword { color: #569cd6; }
        .tag { color: #4ec9b0; }
        .attr-name { color: #9cdcfe; }
        .string { color: #ce9178; }
        .punct { color: #d4d4d4; }
        .function { color: #dcdcaa; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #aeafad;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #777;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

            { text: "button", type: "tag" },
            { text: ">\n<", type: "punct" },
            { text: "div", type: "tag" },
            { text: " ", type: "punct" },
            { text: "class", type: "attr-name" },
            { text: "=", type: "punct" },
            { text: '"result"', type: "string" },

            { text: "id", type: "attr-name" },
            { text: "=", type: "punct" },
            { text: '"result"', type: "string" },
            { text: "></", type: "punct" },
            { text: "div", type: "tag" },
            { text: " \n<", type: "punct" },
            { text: "script", type: "tag" },
            { text: ">\n", type: "punct" },
            { text: "  const", type: "keyword" },
            { text: " options = [\n    ", type: "punct" },
            { text: '"Movie night at home 🍿"', type: "string" },
            { text: ", ", type: "punct" },
            { text: '"Cook a new recipe together 🍝"', type: "string" },
            { text: ", ", type: "punct" },
            { text: '"Stargazing 🌌"', type: "string" },
            { text: ",\n    ", type: "punct" },
            { text: '"Picnic in the park 🧺"', type: "string" },
            { text: ", ", type: "punct" },
            { text: '"Karaoke night 🎤"', type: "string" },
            { text: ", ", type: "punct" },
            { text: '"Try a new restaurant 🍜"', type: "string" },
            { text: ",\n    ", type: "punct" },
            { text: '"Game night 🎲"', type: "string" },

            { text: '"Sunset walk 🌅"', type: "string" },

            { text: "  const", type: "keyword" },
            { text: " colors = [", type: "punct" },
            { text: '"#ff8fa3","#ff4769","#ffb3c1","#e63956","#ff9eb1","#d81b60","#ffc0cb","#c72c48","#ff7a90","#eb5c73"', type: "string" },
            { text: "];\n \n", type: "punct" },
            { text: "  const", type: "keyword" },
            { text: " canvas = document.", type: "punct" },
            { text: "getElementById", type: "function" },
            { text: "(", type: "punct" },
            { text: "'wheel'", type: "string" },
            { text: ");\n  const", type: "keyword" },
            { text: " ctx = canvas.", type: "punct" },
            { text: "getContext", type: "function" },
            { text: "(", type: "punct" },
            { text: "'2d'", type: "string" },
            { text: ");\n  const", type: "keyword" },
            { text: " n = options.length;\n  const", type: "keyword" },
            { text: " arc = (2*Math.PI)/n;\n  let", type: "keyword" },
            { text: " currentRotation = 0;\n \n  ", type: "punct" },

            { text: "    for (let i = 0; i < n; i++) {\n      const angle = i * arc;\n", type: "string" },
            { text: "      ctx.beginPath();\n      ctx.moveTo(150,150);\n      ctx.arc(150,150,150, angle, angle+arc);\n", type: "string" },
            { text: "      ctx.fillStyle = colors[i % colors.length];\n      ctx.fill();\n      ctx.save();\n", type: "string" },
            { text: "      ctx.translate(150,150);\n      ctx.rotate(angle + arc/2);\n      ctx.textAlign = 'right';\n", type: "string" },
            { text: "      ctx.fillStyle = '#fff';\n      ctx.font = 'bold 11px Segoe UI';\n      ctx.fillText(options[i], 140, 5);\n", type: "string" },

            { text: "(", type: "punct" },
            { text: "'result'", type: "string" },
            { text: ");\n    resultBox.style.display = 'none';\n", type: "string" },
            { text: "    const", type: "keyword" },
            { text: " extraSpins = 6 + Math.random()*3;\n    const", type: "keyword" },
            { text: " winningIndex = Math.floor(Math.random()*n);\n", type: "punct" },
            { text: "    const", type: "keyword" },
            { text: " targetAngleDeg = 360 - (winningIndex*(360/n)) - (360/n/2);\n", type: "punct" },
            { text: "    const", type: "keyword" },
            { text: " totalRotation = currentRotation + extraSpins*360 + targetAngleDeg - (currentRotation % 360);\n", type: "punct" },
            { text: "    currentRotation = totalRotation;\n    canvas.style.transform = `rotate(${totalRotation}deg)`;\n", type: "string" },

            { text: "html", type: "tag" },
            { text: ">", type: "punct" }
        ];

        let audioCtx = null;

        // Initialize Web Audio API on click
        window.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }, { once: true });

        // Play synthetic mechanical keyboard click sound
        function playKeySound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500 + Math.random() * 400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.02);
            } catch (e) {}
        }

        const container = document.getElementById("code-content");
        let tokenIdx = 0;
        let charIdx = 0;
        let currentSpan = null;

        function typeWriter() {
            if (tokenIdx < tokens.length) {
                const token = tokens[tokenIdx];
                
                if (charIdx === 0) {
                    currentSpan = document.createElement("span");
                    currentSpan.className = token.type;
                    container.appendChild(currentSpan);
                }

                const currentChar = token.text.charAt(charIdx);
                currentSpan.textContent += currentChar;
                
                // Play sound if character is not a newline/space
                if (currentChar.trim() !== "") {
                    playKeySound();
                }

                charIdx++;

                let typingSpeed = 12 + Math.random() * 15; // Fast typing speed for large code

                // Longer pause after a full line (when hitting newline)
                if (currentChar === '\n') {
                    typingSpeed = 180; 
                    // Auto-scroll terminal body down as it writes
                    const body = document.getElementById("terminal-body");
                    body.scrollTop = body.scrollHeight;
                }

                if (charIdx >= token.text.length) {
                    tokenIdx++;
                    charIdx = 0;
                }

                setTimeout(typeWriter, typingSpeed);
            }
        }

        // Start typing after a short initial pause
        setTimeout(typeWriter, 1000);
