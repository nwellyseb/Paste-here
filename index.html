<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiling Love...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #38bdf8;
        }

        .terminal {
            width: 80%;
            max-width: 600px;
            background-color: #1e293b;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px: solid #334155;
        }

        .terminal-header {
            background-color: #0f172a;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background-color: #ef4444; }
        .yellow { background-color: #f59e0b; }
        .green { background-color: #10b981; }

        .terminal-title {
            color: #94a3b8;
            font-size: 14px;
            margin-left: 10px;
        }

        .terminal-body {
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #e2e8f0;
            min-height: 200px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #38bdf8;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <div class="terminal-title">love_script.js</div>
        </div>
        <div class="terminal-body">
            <span id="code-text"></span><span class="cursor"></span>
        </div>
    </div>

    <script>
        const codeLines = `// Initializing system...
const girlfriend = {
    name: "My Everything ❤️",
    smile: "Absolute perfection",
    status: "Making my life infinitely better"
};

function declareLove() {
    console.log("Loading feelings...");
    return "I love you more than words can code!";
}

// Running sequence...
console.log(declareLove());`;

        let i = 0;
        const speed = 40; // Speed of typing in milliseconds
        const target = document.getElementById("code-text");

        function typeWriter() {
            if (i < codeLines.length) {
                target.textContent += codeLines.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        // Start typing after a short pause
        setTimeout(typeWriter, 800);
    </script>

</body>
</html>
